name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Assemble Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Generated APK Exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk || exit 1
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload PlantWise-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantWise-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload SuperDash-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperDash-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
